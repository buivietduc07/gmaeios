name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

    

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.1f1
          targetPlatform: iOS
          projectPath: .
          # Thêm dòng dưới đây để tránh lỗi Curl 42
          versioning: Semantic
