name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space (Dọn dẹp sâu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.0.31f1 # Bản ổn định nhất để tránh treo
          targetPlatform: iOS
          projectPath: .
          buildName: MyGameBuild

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-Project
          path: build/iOS
