name: Build Game iOS 🚀

on: 
  workflow_dispatch: # Dòng này cực quan trọng để hiện nút Run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.11f1
          targetPlatform: iOS
          projectPath: .

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS
          path: build/iOS
