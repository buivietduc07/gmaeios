name: Lay Ma Unity 🔑

on: workflow_dispatch

jobs:
  get_license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.11f1 # Đúng bản Unity 6 của bạn
