name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # Thay đổi bản Unity ở đây để máy chủ tìm thấy
          unityVersion: 6000.0.31f1 
          targetPlatform: iOS
          projectPath: .
          buildName: iOS-Build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-Project
          path: build/iOS
