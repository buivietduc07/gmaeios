name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.0.1f1 
          targetPlatform: iOS
          projectPath: .
          buildName: iOS-Build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-Project
          path: build/iOS
