name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-22.04 # Dùng bản Ubuntu ổn định này
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # Dùng bản này cực nhẹ và server luôn có sẵn
          unityVersion: 2022.3.10f1 
          targetPlatform: iOS
          projectPath: .
          buildName: MyGameBuild

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-Project
          path: build/iOS
