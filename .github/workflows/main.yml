name: Build Game iOS 🚀

on: 
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.1f1
          targetPlatform: iOS
          projectPath: .
          buildName: MyGame-Build
          # Tham số đặc biệt để xử lý lỗi Package và hiện log chuẩn
          customParameters: "-quit -batchmode -nographics -accept-apiupdate -suppress-common-warnings -logFile /dev/stdout"

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-Project
          path: build/iOS
